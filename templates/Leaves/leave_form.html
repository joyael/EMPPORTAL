<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Leave</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    {% load static %}

    {% include 'main_linkings.html' %}
    <link rel="stylesheet" href="{% static 'css/employee_form.css' %}">
    <script src="{% static 'js/employee_form_validation.js' %}"></script>
</head>
<body>
    {% include 'header.html' %}
    <div class="container mt-5">
        <div class="employeeformcontainer">
        <div class="employeeformbox">
            <div class="title-box">{{ action }} Leave </div>

        <div id="errorbox"></div>
        <form method="post" id="employeeForm">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="buttons-div">
                <button type="submit" class="mybutton">{{ action }}</button>
                <button type="button" class="mybutton" onclick="gotoemployeelist()" data-emplist-url="{% url 'apply_leave' %}" id="cancel_button">Cancel</button>
            </div>
        </form>
        </div>
        </div>
    </div>
    {% include 'footer.html' %}
</body>
</html>
