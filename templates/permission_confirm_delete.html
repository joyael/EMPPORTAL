<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Permission</title>
</head>
<body>
    <h1 >Delete Permission</h1>
    <p>Are you sure you want to delete the permission "{{ permission.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url 'permission_list' %}">Cancel</a>
</body>
</html>
