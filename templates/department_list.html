<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Departments</h1>
        <a href="{% url 'department_create' %}" class="btn btn-primary mb-3">Create New Department</a>
        <table class="table">
            <thead>
                <tr>
                    <th>Department Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for department in departments %}
                <tr>
                    <td>{{ department.department_name }}</td>
                    <td>{{ department.description }}</td>
                    <td>
                        <a href="{% url 'department_update' department.department_id %}" class="btn btn-warning btn-sm">Update</a>
                        <form action="{% url 'department_delete' department.department_id %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
