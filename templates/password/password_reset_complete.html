<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    {% load static %}

    {% include 'main_linkings.html' %}

    <link rel="stylesheet" href="{% static 'css/password_reset_complete.css' %}">
    <link rel="stylesheet" href="{% static 'css/header_no_user.css' %}">
    <style>
        .universe-background {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .galactic-message-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        .starry-title {
            margin-bottom: 20px;
            color: #2a5298;
            font-size: 24px;
            text-transform: uppercase;
        }

        .cosmic-text {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .hyperlink-button {
            display: inline-block;
            background-color: #ff6f61;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .hyperlink-button:hover {
            background-color: #e65c50;
        }
    </style>

</head>
<body>
    
    {% include 'header_no_user.html' %}

    <div class="universe-background">
        <div class="galactic-message-container">
            <h2 class="starry-title">Password Reset Complete!</h2>
            <p class="cosmic-text">Your password has been successfully reset.</p>
            <a href="{% url 'login' %}" class="hyperlink-button">Return to Login</a>
        </div>
    </div>

    {% include 'footer.html' %}
</body>
</html>
