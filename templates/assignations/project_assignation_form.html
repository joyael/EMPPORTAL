<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if action == 'Create' %}Create Project Assignation{% else %}Update Project Assignation{% endif %}</title>
</head>
<body>
    <div class="container mt-5">
        <h2>{% if action == 'Create' %}Create Project Assignation{% else %}Update Project Assignation{% endif %}</h2>
        
        <div id="errorbox" style="display: none;"></div> <!-- Error box for displaying validation errors -->

        <form id="projectForm" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_project">Project:</label>
                {{ form.project }}
            </div>
            <div class="form-group">
                <label for="id_employee">Employee:</label>
                {{ form.employee }}
            </div>
            <div class="form-group">
                <label for="id_role">Role:</label>
                {{ form.role }}
            </div>
            <div class="form-group">
                <label for="id_status">Status:</label>
                {{ form.status }}
            </div>
            <div class="form-group">
                <label for="id_start_date">Start Date:</label>
                {{ form.start_date }}
            </div>
            <div class="form-group">
                <label for="id_end_date">End Date:</label>
                {{ form.end_date }}
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="{% url 'project_assignation_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
